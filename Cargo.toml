[package]
name = "brainfm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "brainfm-cli"
path = "src/main.rs"

[dependencies]
reqwest  = { version = "0.12", features = ["json", "blocking"] }
serde    = { version = "1",    features = ["derive"] }
serde_json = "1"
anyhow   = "1"
clap     = { version = "4",    features = ["derive", "env"] }
