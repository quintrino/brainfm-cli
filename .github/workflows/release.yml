name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source tarball
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v${version}-build.${{ github.run_number }}"
          archive="brainfm-cli-${tag}.tar.gz"
          git archive --format=tar.gz --prefix="brainfm-cli-${tag}/" -o "$archive" HEAD
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "archive=${archive}"
            echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.archive }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          # Homebrew needs a plain dotted version so upgrades order numerically
          brew_version="${{ steps.meta.outputs.version }}.${{ github.run_number }}"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${{ steps.meta.outputs.archive }}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/quintrino/homebrew-tap.git" tap
          cat > tap/Formula/brainfm-cli.rb <<RUBY
          class BrainfmCli < Formula
            desc "Unofficial Brain.fm CLI"
            homepage "https://github.com/${{ github.repository }}"
            url "${url}"
            sha256 "${{ steps.meta.outputs.sha256 }}"
            version "${brew_version}"

            depends_on "mpv"
            depends_on "rust" => :build

            on_linux do
              depends_on "pkg-config" => :build
              depends_on "openssl@3"
            end

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "Unofficial Brain.fm CLI", shell_output("#{bin}/brainfm --help")
            end
          end
          RUBY

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/brainfm-cli.rb
          git commit -m "brainfm-cli ${brew_version}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
